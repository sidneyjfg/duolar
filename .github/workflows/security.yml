name: Security checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --workspaces --audit-level=high || true

      - name: Semgrep security report
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep --config p/security-audit --config p/owasp-top-ten /src || true

      - name: Semgrep secrets report
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep --config p/secrets /src
