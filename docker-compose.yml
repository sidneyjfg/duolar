services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: duolar-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
